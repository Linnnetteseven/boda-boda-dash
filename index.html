<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1B1030">
<title>Boda Boda Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1B1030;--paper:#FFFDF5;--magenta:#FF2E88;--yellow:#FFD23F;--cyan:#19C3E6;--green:#00B377;--lime:#C6F432;
    --display:Bungee,"Arial Black",Impact,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#FFD6A5;font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #fx{pointer-events:none;z-index:40}

  .hud{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 12px) 0 calc(env(safe-area-inset-left) + 12px);
    pointer-events:none;transition:opacity .3s,transform .3s}
  .hud.off{opacity:0;transform:translateY(-12px)}
  .hud.off .pause{pointer-events:none}
  .cash{font-family:var(--display);font-size:clamp(22px,6vw,32px);line-height:1;background:var(--yellow);border:3px solid var(--ink);
    border-radius:14px;padding:10px 14px 8px;box-shadow:4px 4px 0 var(--magenta);display:flex;align-items:baseline;gap:8px;transform-origin:left center}
  .cash small{font-size:.5em}
  .cash.bump{animation:bump .35s cubic-bezier(.3,1.6,.5,1)}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.14) rotate(-2deg)}100%{transform:scale(1)}}
  .right{display:flex;gap:8px;align-items:flex-start}
  .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .pill{font-weight:800;font-size:14px;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:3px 12px 1px;white-space:nowrap}
  .pill.lvl{background:var(--cyan)}
  .pause{pointer-events:auto;width:52px;height:52px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);
    box-shadow:3px 3px 0 var(--magenta);display:grid;place-items:center;cursor:pointer;padding:0;touch-action:manipulation}
  .pause span{display:flex;gap:6px}.pause i{display:block;width:7px;height:20px;background:var(--ink);border-radius:2px}
  .pause:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--magenta)}
  .pause:focus-visible{outline:4px solid var(--cyan);outline-offset:3px}

  .toast{position:fixed;left:50%;top:26%;z-index:15;transform:translate(-50%,-50%) scale(.6) rotate(-4deg);opacity:0;font-family:var(--display);
    font-size:clamp(28px,8vw,46px);color:var(--yellow);text-shadow:3px 3px 0 var(--magenta),6px 6px 0 var(--ink);pointer-events:none;white-space:nowrap}
  .toast.show{animation:toast 1.6s cubic-bezier(.2,1.4,.4,1) forwards}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.6) rotate(-4deg)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05) rotate(-4deg)}
    75%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-4deg)}100%{opacity:0;transform:translate(-50%,-70%) scale(1) rotate(-4deg)}}
  .float{position:fixed;z-index:12;pointer-events:none;font-family:var(--display);font-size:clamp(22px,6vw,30px);color:var(--yellow);
    text-shadow:2px 2px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);transform:translate(-50%,-50%);
    animation:rise .9s ease-out forwards;white-space:nowrap}
  @keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-220%) scale(1)}}

  .screen{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;
    background:radial-gradient(ellipse at 50% 45%,rgba(27,16,48,.15),rgba(27,16,48,.6));transition:opacity .35s}
  .screen.hidden{opacity:0;pointer-events:none}
  .screen.hidden .card{transform:translateY(30px) scale(.96)}
  .card{width:min(92vw,430px);background:var(--paper);border:4px solid var(--ink);border-radius:26px;
    box-shadow:0 0 0 5px var(--yellow),0 0 0 9px var(--ink),12px 14px 0 9px var(--magenta);overflow:hidden;text-align:center;
    transition:transform .45s cubic-bezier(.2,1.3,.4,1)}
  .kerb{height:16px;background:repeating-linear-gradient(90deg,var(--ink) 0 22px,var(--yellow) 22px 44px)}
  .fringe{height:14px;background:linear-gradient(-45deg,transparent 70%,var(--paper) 70%) 0 0/14px 14px,
      linear-gradient(45deg,transparent 70%,var(--paper) 70%) 0 0/14px 14px,
      linear-gradient(90deg,var(--magenta) 0 33%,var(--cyan) 33% 66%,var(--green) 66%) 0 0/42px 14px}
  .body{padding:18px 24px 26px}
  h1{margin:4px 0 6px;font-family:var(--display);font-weight:400;line-height:.92;color:var(--magenta);text-shadow:3px 3px 0 var(--ink)}
  h1 .a{display:block;font-size:clamp(34px,10vw,46px)}
  h1 .b{display:block;font-family:'Bungee Shade',Bungee,sans-serif;font-size:clamp(58px,18vw,84px);color:var(--ink);text-shadow:none;letter-spacing:.02em}
  .lede{margin:6px auto 4px;max-width:30ch;font-size:17px;line-height:1.35;font-weight:500}
  .keys{margin:2px 0 18px;font-size:14px;font-weight:700;opacity:.7}
  .btn{font-family:var(--display);font-size:clamp(28px,8vw,36px);color:var(--paper);background:var(--magenta);border:4px solid var(--ink);
    border-radius:999px;padding:14px 46px 10px;box-shadow:0 7px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s,background .2s;touch-action:manipulation}
  .btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
  .btn:focus-visible,.link:focus-visible{outline:4px solid var(--cyan);outline-offset:4px}
  .btn:disabled{opacity:.5;cursor:wait}
  @media (hover:hover){.btn:hover{background:#ff4a99}}
  .link{display:block;margin:16px auto 0;background:none;border:0;font:inherit;font-weight:800;font-size:16px;color:var(--ink);
    text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:6px 10px}
  .over-title{font-family:var(--display);font-size:clamp(38px,11vw,52px);margin:6px 0 0;line-height:1;color:var(--ink)}
  .reason{margin:4px 0 12px;font-size:17px;font-weight:600}
  .score{font-family:var(--display);font-size:clamp(46px,14vw,64px);line-height:1;color:var(--magenta);text-shadow:3px 3px 0 var(--ink)}
  .score small{font-size:.42em;color:var(--ink);text-shadow:none;margin-right:6px}
  .bestline{margin:8px 0 18px;font-weight:700;font-size:15px;opacity:.75}
  .record{display:none;margin:0 auto 10px;width:max-content;font-family:var(--display);font-size:22px;background:var(--yellow);
    border:3px solid var(--ink);border-radius:12px;padding:6px 14px 3px;transform:rotate(-4deg)}
  .record.on{display:block;animation:pop .6s cubic-bezier(.2,1.6,.4,1) .25s both}
  @keyframes pop{0%{transform:rotate(-4deg) scale(0)}100%{transform:rotate(-4deg) scale(1)}}
  @media (prefers-reduced-motion:reduce){.cash.bump,.record.on,.toast.show,.float{animation-duration:.01s}.card{transition:none}}
</style>
</head>
<body>
<canvas id="game" aria-label="Boda Boda Dash game"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="hud off" id="hud">
  <div class="cash" id="cash"><small>Ksh</small><span id="money">0</span></div>
  <div class="right">
    <div class="side">
      <div class="pill lvl" id="lvl">Speed 1</div>
      <div class="pill" id="bestPill">Best Ksh 0</div>
    </div>
    <button class="pause" id="pauseBtn" aria-label="Pause"><span><i></i><i></i></span></button>
  </div>
</div>
<div class="toast" id="toast">Faster!</div>

<section class="screen" id="start">
  <div class="card"><div class="kerb"></div><div class="fringe"></div>
    <div class="body">
      <h1><span class="a">Boda Boda</span><span class="b">Dash</span></h1>
      <p class="lede">Dodge potholes and matatus. Pick up waving passengers for Ksh 50 each.</p>
      <p class="keys" id="howto">Switch lanes with ← → or A / D. Press P to pause.</p>
      <button class="btn" id="rideBtn" disabled>Ride!</button>
    </div>
  </div>
</section>

<section class="screen hidden" id="paused">
  <div class="card"><div class="kerb"></div><div class="fringe"></div>
    <div class="body">
      <p class="over-title">Paused</p>
      <p class="reason" id="pauseText">Your fares are safe.</p>
      <button class="btn" id="resumeBtn">Resume</button>
      <button class="link" id="endBtn">End ride</button>
    </div>
  </div>
</section>

<section class="screen hidden" id="over">
  <div class="card"><div class="kerb"></div><div class="fringe"></div>
    <div class="body">
      <p class="over-title">Umegonga!</p>
      <p class="reason" id="reason">You hit a pothole.</p>
      <div class="record" id="record">New record!</div>
      <div class="score"><small>Ksh</small><span id="final">0</span></div>
      <p class="bestline" id="bestline">Best: Ksh 0</p>
      <button class="btn" id="againBtn">Ride again</button>
    </div>
  </div>
</section>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const $ = id => document.getElementById(id);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isTouch = matchMedia('(pointer: coarse)').matches;
if (isTouch) $('howto').textContent = 'Tap the left or right side to switch lanes.';

const C = { ink:'#1B1030', paper:'#FFFDF5', magenta:'#FF2E88', yellow:'#FFD23F', cyan:'#19C3E6', green:'#00B377',
  lime:'#C6F432', orange:'#FF7A1A', purple:'#7B3FF2', red:'#E8364A' };
const HORIZON = '#FFD6A5';
const PAINT = [['#FF2E88','#FFD23F','#19C3E6'],['#7B3FF2','#C6F432','#FF2E88'],['#00B377','#FFD23F','#FF7A1A'],
  ['#19C3E6','#FF2E88','#FFFDF5'],['#FF7A1A','#1B1030','#FFD23F'],['#FFD23F','#7B3FF2','#19C3E6']];
const NAMES = ['NGANYA','MZINGA','DASH 254','RONGAI EXP','SWAG FM','BABA YAO','MOTOMOTO','KIBANDA'];
const SHIRTS = ['#FF2E88','#19C3E6','#00B377','#FF7A1A','#7B3FF2','#FFD23F','#E8364A'];
const SKINS = ['#5C3317','#7A4A2B','#4A2A14','#8B5A3C'];
const SIGNS = ['DUKA','CHIPS','HOTEL','KINYOZI','MITUMBA','SALON','MBOGA','M-SHOP'];
const BOARDS = ['NAIROBI 254','CHAI NA MANDAZI','SAFARI SODA','HAKUNA MATATA FM'];
const WALLS = ['#FF2E88','#19C3E6','#00B377','#FF7A1A','#7B3FF2','#FFD23F','#3DDC97'];

const LANE = 2.4, LANES = [-LANE, 0, LANE], ROAD_HALF = LANE*1.5 + 0.5, SPAN = 240, FAR = -150;
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const store = { get(){ try { return +localStorage.getItem('bodaDashBest') || 0 } catch(e){ return 0 } },
                set(v){ try { localStorage.setItem('bodaDashBest', v) } catch(e){} } };

// ---------- renderer / scene ----------
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: $('game'), antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  $('howto').textContent = 'This device could not start 3D graphics. Try another browser.';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouch ? 1.75 : 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(HORIZON, 55, 150);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 400);

const hemi = new THREE.HemisphereLight('#DDF6FF', '#C0643A', 1.9); scene.add(hemi);
const sun = new THREE.DirectionalLight('#FFEFD0', 2.6);
sun.position.set(-10, 22, 2); sun.target.position.set(0, 0, -14); scene.add(sun, sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left:-26, right:26, top:30, bottom:-30, near:1, far:80 }); sun.shadow.bias = -0.0005;

// ---------- helpers ----------
const mats = {};
const lam = (c, extra) => { const k = c + (extra ? JSON.stringify(extra) : ''); return mats[k] ||= new THREE.MeshLambertMaterial({ color:c, ...extra }); };
function canvasTex(w, h, draw, repeat){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function specks(g, w, h, cols, n){ for (let i=0;i<n;i++){ g.globalAlpha = rnd(.12,.45); g.fillStyle = pick(cols); g.fillRect(rnd(0,w), rnd(0,h), rnd(1,3), rnd(1,3)); } g.globalAlpha = 1; }
function mesh(geo, mat, x=0, y=0, z=0, shadow=true){ const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); m.castShadow = shadow; m.receiveShadow = true; return m; }
const box = (w,h,d) => new THREE.BoxGeometry(w,h,d);
const FONT = (px) => `${px}px Bungee, "Arial Black", Impact, sans-serif`;

// ---------- world ----------
const scroll = [];   // textures that scroll with distance: {tex, axis, per, sign}
let roadTex;
function buildWorld(){
  // sky
  scene.background = canvasTex(4, 512, (g,w,h) => {
    const gr = g.createLinearGradient(0,0,0,h);
    gr.addColorStop(0,'#2FC0F0'); gr.addColorStop(.38,'#9FE6FF'); gr.addColorStop(.6, HORIZON); gr.addColorStop(1, HORIZON);
    g.fillStyle = gr; g.fillRect(0,0,w,h);
  });
  // skyline backdrop
  const skyline = canvasTex(2048, 512, (g,w,h) => {
    const sunG = g.createRadialGradient(w*.62,h*.55,10,w*.62,h*.55,260); sunG.addColorStop(0,'rgba(255,246,200,1)'); sunG.addColorStop(.25,'rgba(255,236,170,.9)'); sunG.addColorStop(1,'rgba(255,214,165,0)');
    g.fillStyle = sunG; g.fillRect(0,0,w,h);
    g.fillStyle = 'rgba(120,170,150,.55)'; g.beginPath(); g.moveTo(0,h*.78);
    for (let x=0;x<=w;x+=64) g.lineTo(x, h*.7 - Math.sin(x/170)*30 - Math.sin(x/53)*10 - (x>w*.05&&x<w*.4 ? Math.sin((x-w*.05)/(w*.35)*Math.PI)*70 : 0));
    g.lineTo(w,h); g.lineTo(0,h); g.fill();
    let x = w*.25;
    while (x < w*.85) {
      const bw = rnd(30,80), bh = rnd(60,200)*(1 - Math.abs(x-w*.55)/(w*.5));
      g.fillStyle = pick(['#B48CE8','#A27BDD','#C9A6F2','#9572D3']); g.fillRect(x, h*.8-bh, bw, bh+h);
      g.fillStyle = 'rgba(255,240,200,.55)';
      for (let wy = h*.8-bh+10; wy < h*.8-8; wy += 16) for (let wx = x+6; wx < x+bw-8; wx += 14) if (Math.random()<.5) g.fillRect(wx, wy, 6, 8);
      x += bw + rnd(2,14);
    }
    // a round tower with a saucer top
    g.fillStyle = '#8A66CC'; g.fillRect(w*.5, h*.8-250, 44, 260); g.beginPath(); g.ellipse(w*.5+22, h*.8-252, 46, 12, 0, 0, Math.PI*2); g.fill();
    g.fillRect(w*.5+19, h*.8-290, 6, 40);
    const haze = g.createLinearGradient(0,h*.6,0,h); haze.addColorStop(0,'rgba(255,214,165,0)'); haze.addColorStop(.6,HORIZON); g.fillStyle = haze; g.fillRect(0,h*.6,w,h*.4);
  });
  const sky = new THREE.Mesh(new THREE.PlaneGeometry(560,140), new THREE.MeshBasicMaterial({ map:skyline, transparent:true, fog:false, depthWrite:false }));
  sky.position.set(0, 140*0.5 - 26, -215); scene.add(sky);

  // ground
  const groundTex = canvasTex(256,256,(g,w,h)=>{ g.fillStyle='#B4532A'; g.fillRect(0,0,w,h); specks(g,w,h,['#8f3d1c','#d06a3a','#e08a55'],900); }, true);
  groundTex.repeat.set(300/12, SPAN/12);
  const ground = mesh(new THREE.PlaneGeometry(300, SPAN), new THREE.MeshLambertMaterial({ map:groundTex }), 0, -0.02, 20 - SPAN/2, false);
  ground.rotation.x = -Math.PI/2; scene.add(ground); scroll.push({ tex:groundTex, axis:'y', per:12, sign:1 });

  // road
  roadTex = canvasTex(256,256,(g,w,h)=>{
    g.fillStyle='#4A4262'; g.fillRect(0,0,w,h); specks(g,w,h,['#2E2840','#5F567A','#6E6590'],800);
    const px = x => (x + ROAD_HALF)/(2*ROAD_HALF)*w;
    g.fillStyle = C.yellow; g.fillRect(px(-ROAD_HALF+.25),0,5,h); g.fillRect(px(ROAD_HALF-.25)-5,0,5,h);
    g.fillStyle = 'rgba(255,253,245,.92)'; for (const x of [-LANE/2, LANE/2]) g.fillRect(px(x)-4, 0, 8, h*.5);
  }, true);
  roadTex.repeat.set(1, SPAN/8);
  const road = mesh(new THREE.PlaneGeometry(ROAD_HALF*2, SPAN), new THREE.MeshLambertMaterial({ map:roadTex }), 0, 0, 20 - SPAN/2, false);
  road.rotation.x = -Math.PI/2; scene.add(road); scroll.push({ tex:roadTex, axis:'y', per:8, sign:1 });

  // kerbs and pavements
  for (const s of [-1, 1]) {
    const kx = s*(ROAD_HALF + .175);
    scene.add(mesh(box(.35,.3,SPAN), lam(C.ink), kx, .15, 20 - SPAN/2, false));
    const top = canvasTex(64,64,(g,w,h)=>{ g.fillStyle=C.yellow; g.fillRect(0,0,w,h/2); g.fillStyle=C.ink; g.fillRect(0,h/2,w,h/2); }, true);
    top.repeat.set(1, SPAN/2);
    const kt = mesh(new THREE.PlaneGeometry(.35, SPAN), new THREE.MeshLambertMaterial({ map:top }), kx, .302, 20 - SPAN/2, false);
    kt.rotation.x = -Math.PI/2; scene.add(kt); scroll.push({ tex:top, axis:'y', per:2, sign:1 });
    const side = canvasTex(64,64,(g,w,h)=>{ g.fillStyle=C.yellow; g.fillRect(0,0,w/2,h); g.fillStyle=C.ink; g.fillRect(w/2,0,w/2,h); }, true);
    side.repeat.set(SPAN/2, 1);
    const ks = mesh(new THREE.PlaneGeometry(SPAN, .3), new THREE.MeshLambertMaterial({ map:side }), s*(ROAD_HALF - .002), .15, 20 - SPAN/2, false);
    ks.rotation.y = s < 0 ? Math.PI/2 : -Math.PI/2; scene.add(ks); scroll.push({ tex:side, axis:'x', per:2, sign: s < 0 ? 1 : -1 });

    const px = s*(ROAD_HALF + .35 + 1.1);
    scene.add(mesh(box(2.2,.25,SPAN), lam('#B9AE9F'), px, .125, 20 - SPAN/2, false));
    const pave = canvasTex(128,128,(g,w,h)=>{ g.fillStyle='#D8CDBE'; g.fillRect(0,0,w,h); specks(g,w,h,['#a99e8f','#efe6d8'],300); g.fillStyle='rgba(27,16,48,.2)'; g.fillRect(0,0,w,3); g.fillRect(w/2,0,3,h); }, true);
    pave.repeat.set(1, SPAN/2.5);
    const pt = mesh(new THREE.PlaneGeometry(2.2, SPAN), new THREE.MeshLambertMaterial({ map:pave }), px, .252, 20 - SPAN/2, false);
    pt.rotation.x = -Math.PI/2; scene.add(pt); scroll.push({ tex:pave, axis:'y', per:2.5, sign:1 });
  }
  buildScenery();
}

// ---------- roadside props ----------
const props = [];
const signTex = {};
function signTexture(text, bg){
  const k = text+bg; if (signTex[k]) return signTex[k];
  return signTex[k] = canvasTex(512,128,(g,w,h)=>{
    g.fillStyle = bg; g.fillRect(0,0,w,h); g.fillStyle = C.ink; g.fillRect(0,0,w,10); g.fillRect(0,h-10,w,10);
    g.font = FONT(64); g.textAlign='center'; g.textBaseline='middle';
    g.lineWidth = 8; g.strokeStyle = C.ink; g.strokeText(text, w/2, h/2+4, w*.88); g.fillStyle = C.paper; g.fillText(text, w/2, h/2+4, w*.88);
  });
}
function makeShop(s){
  const g = new THREE.Group(), wall = pick(WALLS), H = rnd(2.6, 4.2), D = 3, L = rnd(3.4, 4.6);
  g.add(mesh(box(D,H,L), lam(wall), 0, H/2, 0));
  g.add(mesh(box(D+.5,.18,L+.5), lam('#A9A1BA'), 0, H+.09, 0));
  g.add(mesh(box(.06,.5,L), lam(C.ink), -s*(D/2+.01), .25, 0, false));
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(L*.9, L*.9/4), new THREE.MeshLambertMaterial({ map:signTexture(pick(SIGNS), pick(PAINT.flat().filter(c=>c!==wall && c!==C.paper))) }));
  sign.position.set(-s*(D/2+.03), H-.75, 0); sign.rotation.y = s > 0 ? -Math.PI/2 : Math.PI/2; g.add(sign);
  const door = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 1.9), lam('#2A1E40'));

let actx = null;
function audio(){ if (!actx) { try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } if (actx && actx.state==='suspended') actx.resume(); }
function beep(f, dur, type='square', vol=.07, slide=0){
  if (!actx) return;
  try { const o = actx.createOscillator(), g = actx.createGain(), n = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, n); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide), n+dur);
    g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(.0001, n+dur); o.connect(g).connect(actx.destination); o.start(n); o.stop(n+dur);
  } catch(e){}
}

  level(){ [523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.12,'triangle',.08),i*80)); },
  record(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.16,'square',.05),i*110)); },

// ---------- game state ----------
let ready = false, state = 'start', money = 0, best = store.get(), t = 0, level = 1, time = 0;
let speed = 0, spawnDist = 0, lane = 1, px = 0, pvx = 0, carryT = 0, shake = 0, crashT = 0, crashDir = 1, attractT = 0;
let objs = [];
const baseSpeed = () => 17, maxSpeed = () => 17*2.6;

function clearObjs(){ for (const o of objs) scene.remove(o.obj); objs = []; for (const p of particles) scene.remove(p); particles = []; }
function resetBoda(){ boda.rotation.set(0,0,0); boda.position.set(px,0,0); passenger.visible = false; }
function startGame(){
  if (!ready || state === 'play' || state === 'crash' || state === 'paused') return;
  audio();
  clearObjs(); confetti = [];
  state = 'play'; money = 0; t = 0; level = 1; carryT = 0; lane = 1; spawnDist = 25;
  resetBoda();

}
function pause(){

  $('paused').classList.remove('hidden'); setTimeout(()=>$('resumeBtn').focus({preventScroll:true}), 50);
}
function resume(){ if (state !== 'paused') return; state = 'play'; $('paused').classList.add('hidden'); clock.getDelta(); }
function endRide(){ if (state !== 'paused') return; $('paused').classList.add('hidden'); $('reason').textContent = 'You parked the boda.'; showOver(); }
function crash(o){

  $('reason').textContent = o.type === 'pothole'
    ? pick(['You hit a pothole.','That pothole was deeper than it looked.'])
    : pick(['You crashed into a matatu.','A matatu stopped right in front of you.']);
  burst(new THREE.Vector3(px, 1, -.6), 26, [C.yellow, C.magenta, C.paper, '#888'], 7);

  $('final').textContent = money;

  $('record').classList.toggle('on', record);

}

function toast(text){ const el = $('toast'); el.textContent = text; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }
function floatText(pos, text){
  const v = pos.clone().project(camera), el = document.createElement('div');
  el.className = 'float'; el.textContent = text;
  el.style.left = `${(v.x*.5+.5)*innerWidth}px`; el.style.top = `${(-v.y*.5+.5)*innerHeight}px`;
  document.body.appendChild(el); setTimeout(()=>el.remove(), 950);
}

function spawnRow(){
  const busy = new Set(objs.filter(o => o.type === 'matatu' && o.obj.position.z < -4).map(o => o.lane));
  const free = [0,1,2].filter(i => !busy.has(i)).sort(() => Math.random() - .5);
  let n = Math.random() < (level >= 2 ? .45 : .22) ? 2 : 1;
  n = Math.min(n, free.length - 1);
  const used = [];
  for (let i=0;i<n;i++){
    const l = free[i]; used.push(l);
    const isM = Math.random() < .45;
    const obj = isM ? makeMatatu() : makePothole();
    obj.position.set(LANES[l] + (isM ? 0 : rnd(-.3,.3)), 0, FAR);
    if (!isM) obj.rotation.y = rnd(0, Math.PI);
    scene.add(obj);
    objs.push({ type: isM ? 'matatu' : 'pothole', lane:l, obj, rel: isM ? rnd(.55,.68) : 1, hx: isM ? 1.32 : .9, hz: isM ? 2.4 + .75 : .8 });
  }
  const left = free.filter(l => !used.includes(l));
  if (left.length && Math.random() < .6) {
    const l = pick(left), obj = makePax(); obj.position.set(LANES[l], 0, FAR - rnd(0,6)); scene.add(obj);
    objs.push({ type:'pax', lane:l, obj, rel:1, hx:1.2, hz:1.0 });
  }
}

// ---------- camera framing ----------
let camBase = { y:3.4, z:7.4, fov:60, look:-10 };
function resize(){
  const w = innerWidth, h = innerHeight, aspect = w/h;
  renderer.setSize(w, h, false);
  fx.width = w * Math.min(devicePixelRatio||1, 2); fx.height = h * Math.min(devicePixelRatio||1, 2);
  fctx.setTransform(fx.width/w, 0, 0, fx.height/h, 0, 0);
  const p = Math.max(0, Math.min(1, (1.1 - aspect)/.6));   // 0 = landscape, 1 = tall phone
  camBase = { y: 3.4 + p*1.8, z: 7.4 + p*3.6, fov: 60 + p*14, look: -10 - p*4 };
  camera.aspect = aspect; camera.updateProjectionMatrix();
}

// ---------- main loop ----------
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
function update(dt){
  time += dt;
  if (state === 'paused') return;
  let target = 0;
  if (state === 'play') {
    t += dt;
    const nl = 1 + Math.floor(t/30);
    if (nl > level) { level = nl; $('lvl').textContent = `Speed ${level}`; toast(`Faster! Speed ${level}`); sfx.level(); }
    target = Math.min(maxSpeed(), baseSpeed()*(1 + .2*(level-1)));
  } else if (state === 'start') target = baseSpeed()*.55;
  else if (state === 'crash') { crashT += dt; if (crashT > 1.1) showOver(); }
  speed += (target - speed) * Math.min(1, dt*(state === 'crash' ? 4 : 1.3));
  const d = speed*dt;

  for (const s of scroll) s.tex.offset[s.axis] = (s.tex.offset[s.axis] + s.sign*d/s.per) % 1;
  for (const p of props) { p.position.z += d; if (p.position.z > 16) p.position.z -= PROP_SPAN; }

  for (const o of objs) {
    o.obj.position.z += d*o.rel;
    const u = o.obj.userData;
    if (o.type === 'pax') {
      u.arm.rotation.z = 2.5 + Math.sin(time*9 + u.ph)*.5;
      u.coin.rotation.y += dt*3; u.coin.position.y = 2.7 + Math.sin(time*4 + u.ph)*.12;
      const s = 1 + Math.sin(time*6 + u.ph)*.12; u.ring.scale.set(s,1,s);
    } else if (o.type === 'matatu' && !reduceMotion) u.glow.material.opacity = .45 + Math.sin(time*7 + o.lane)*.2;
  }
  objs = objs.filter(o => { if (o.obj.position.z > 14 || o.dead) { scene.remove(o.obj); return false; } return true; });

  if (state === 'play' || state === 'start') {
    if (state === 'start') { attractT -= dt; if (attractT <= 0) { lane = Math.max(0, Math.min(2, lane + pick([-1,1]))); attractT = rnd(1.2, 2.4); } }
    const tx = LANES[lane];
    pvx += ((tx - px)*95 - pvx*15)*dt;     // springy lane change: a little overshoot, then settle
    px += pvx*dt;
    boda.position.x = px;
    boda.rotation.z += (Math.max(-.45, Math.min(.45, -pvx*.07)) - boda.rotation.z)*Math.min(1, dt*14);
    boda.rotation.y = Math.max(-.25, Math.min(.25, -pvx*.03));
    boda.position.y = Math.abs(Math.sin(time*22))*.02*(speed/baseSpeed());
  }
  if (state === 'play') {
    spawnDist -= d;
    if (spawnDist <= 0) { spawnRow(); spawnDist = rnd(17, 25); }
    for (const o of objs) {
      const p = o.obj.position;
      if (Math.abs(p.x - px) < o.hx && Math.abs(p.z) < o.hz) {
        if (o.type === 'pax') {
          o.dead = true; money += 50; carryT = 2; paxShirtMat.color.set(o.obj.userData.shirt); passenger.visible = true; updateHud();
          const c = $('cash'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump');
          floatText(tmp.set(p.x, 2.6, p.z), '+Ksh 50');
          burst(tmp.set(p.x, 2.4, p.z), 12, [C.yellow, C.lime, C.paper], 5); sfx.coin();
        } else { crash(o); break; }
      }
    }
  }
  if (state === 'crash') {
    boda.rotation.z += (crashDir*1.35 - boda.rotation.z)*Math.min(1, dt*8);
    boda.position.x += crashDir*dt*2*Math.max(0, 1 - crashT);
    boda.position.y = Math.max(0, boda.position.y - dt);
  }
  carryT = Math.max(0, carryT - dt); if (carryT === 0 && state === 'play') passenger.visible = false;
  for (const w of wheels) w.rotation.x -= d/.36;

  for (const p of particles) { const u = p.userData; u.life -= dt; u.v.y -= 18*dt; p.position.addScaledVector(u.v, dt); p.rotation.x += dt*6; p.scale.setScalar(Math.max(.01, u.life/u.max)); if (p.position.y < .07) { p.position.y = .07; u.v.y *= -.3; u.v.x *= .7; } }
  particles = particles.filter(p => { if (p.userData.life <= 0) { scene.remove(p); return false; } return true; });
  shake *= Math.pow(.02, dt);
}
function placeCamera(dt){
  const sp = Math.max(0, (speed - baseSpeed())/(maxSpeed() - baseSpeed()));
  const fov = camBase.fov + sp*9;
  if (Math.abs(camera.fov - fov) > .01) { camera.fov += (fov - camera.fov)*Math.min(1, dt*3); camera.updateProjectionMatrix(); }
  const cx = boda.position.x*.72;
  camera.position.x += (cx - camera.position.x)*Math.min(1, dt*6);
  camera.position.y = camBase.y + (shake ? rnd(-shake, shake) : 0);
  camera.position.z = camBase.z - sp*.8 + (shake ? rnd(-shake, shake) : 0);
  camera.lookAt(camera.position.x*.9 + boda.position.x*.1, 1.2, camBase.look);
}
function frame(){
  const dt = Math.min(.05, clock.getDelta());
  update(dt); placeCamera(dt);
  renderer.render(scene, camera);
  renderFx(dt);
}

// ---------- confetti ----------
const fx = $('fx'), fctx = fx.getContext('2d');
let confetti = [];
function burstConfetti(){
  const n = reduceMotion ? 40 : 180, W = innerWidth, H = innerHeight, cols = [C.magenta, C.yellow, C.cyan, C.green, C.lime, C.orange, C.purple];
  for (let i=0;i<n;i++){ const L = i % 2 === 0;
    confetti.push({ x: L ? -10 : W+10, y: H*rnd(.55,.9), vx:(L?1:-1)*rnd(250,700), vy:rnd(-900,-400), w:rnd(6,12), h:rnd(10,18), rot:rnd(0,6), vr:rnd(-10,10), c:pick(cols), life:rnd(2.5,4) }); }
}
function renderFx(dt){
  fctx.clearRect(0, 0, innerWidth, innerHeight);
  if (!confetti.length) return;
  for (const p of confetti) {
    p.vy += 900*dt; p.vx *= Math.pow(.6, dt); p.vy *= Math.pow(.7, dt); p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.vr*dt; p.life -= dt;
    fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.rot); fctx.scale(1, Math.cos(p.rot*1.7));
    fctx.globalAlpha = Math.max(0, Math.min(1, p.life)); fctx.fillStyle = p.c; fctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); fctx.restore();
  }
  confetti = confetti.filter(p => p.life > 0 && p.y < innerHeight + 40);
}

// ---------- input ----------
function steer(dir){ if (state !== 'play') return; const n = Math.max(0, Math.min(2, lane + dir)); if (n !== lane) { lane = n; sfx.swish(); } }
addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowLeft','a','A'].includes(k)) { e.preventDefault(); if (!e.repeat) steer(-1); }
  else if (['ArrowRight','d','D'].includes(k)) { e.preventDefault(); if (!e.repeat) steer(1); }
  else if (['p','P','Escape'].includes(k)) { e.preventDefault(); state === 'paused' ? resume() : pause(); }
  else if ((k === 'Enter' || k === ' ') && (state === 'start' || state === 'over')) { e.preventDefault(); startGame(); }
});
$('game').addEventListener('pointerdown', e => { if (state !== 'play') return; e.preventDefault(); steer(e.clientX < innerWidth/2 ? -1 : 1); });
$('game').addEventListener('contextmenu', e => e.preventDefault());
$('rideBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('pauseBtn').addEventListener('click', pause);
$('resumeBtn').addEventListener('click', resume);
$('endBtn').addEventListener('click', endRide);
addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); else clock.getDelta(); });
addEventListener('blur', pause);

// ---------- boot ----------
const fontsReady = Promise.race([
  document.fonts ? Promise.all([document.fonts.load(FONT(40)), document.fonts.load('700 20px "Baloo 2"')]) : Promise.resolve(),
  new Promise(r => setTimeout(r, 2500))
]).catch(()=>{});
fontsReady.then(() => {
  buildWorld(); buildBoda(); resize(); updateHud();
  camera.position.set(0, camBase.y, camBase.z);
  speed = baseSpeed()*.55;
  ready = true; $('rideBtn').disabled = false; $('rideBtn').focus({preventScroll:true});
  renderer.setAnimationLoop(frame);
});
</script>
</body>
</html>
